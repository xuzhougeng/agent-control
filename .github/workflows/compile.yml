name: compile

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build ${{ matrix.component }} ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: cc-control
            dir: cc-control
            pkg: ./cmd/cc-control
            goos: linux
            goarch: amd64
          - component: cc-agent
            dir: cc-agent
            pkg: ./cmd/cc-agent
            goos: linux
            goarch: amd64
          - component: cc-agent
            dir: cc-agent
            pkg: ./cmd/cc-agent
            goos: linux
            goarch: arm64
          - component: cc-agent
            dir: cc-agent
            pkg: ./cmd/cc-agent
            goos: darwin
            goarch: amd64
          - component: cc-agent
            dir: cc-agent
            pkg: ./cmd/cc-agent
            goos: darwin
            goarch: arm64
          - component: cc-agent
            dir: cc-agent
            pkg: ./cmd/cc-agent
            goos: windows
            goarch: amd64
          - component: cc-agent
            dir: cc-agent
            pkg: ./cmd/cc-agent
            goos: windows
            goarch: arm64
          - component: cc-chat-claude
            dir: cc-proxy
            pkg: ./cmd/cc-chat-claude
            goos: linux
            goarch: amd64
          - component: cc-chat-claude
            dir: cc-proxy
            pkg: ./cmd/cc-chat-claude
            goos: linux
            goarch: arm64
          - component: cc-chat-claude
            dir: cc-proxy
            pkg: ./cmd/cc-chat-claude
            goos: darwin
            goarch: amd64
          - component: cc-chat-claude
            dir: cc-proxy
            pkg: ./cmd/cc-chat-claude
            goos: darwin
            goarch: arm64
          - component: cc-chat-claude
            dir: cc-proxy
            pkg: ./cmd/cc-chat-claude
            goos: windows
            goarch: amd64
          - component: cc-chat-claude
            dir: cc-proxy
            pkg: ./cmd/cc-chat-claude
            goos: windows
            goarch: arm64
          - component: cc-chat-echo
            dir: cc-proxy
            pkg: ./cmd/cc-chat-echo
            goos: linux
            goarch: amd64
          - component: cc-chat-echo
            dir: cc-proxy
            pkg: ./cmd/cc-chat-echo
            goos: linux
            goarch: arm64
          - component: cc-chat-echo
            dir: cc-proxy
            pkg: ./cmd/cc-chat-echo
            goos: darwin
            goarch: amd64
          - component: cc-chat-echo
            dir: cc-proxy
            pkg: ./cmd/cc-chat-echo
            goos: darwin
            goarch: arm64
          - component: cc-chat-echo
            dir: cc-proxy
            pkg: ./cmd/cc-chat-echo
            goos: windows
            goarch: amd64
          - component: cc-chat-echo
            dir: cc-proxy
            pkg: ./cmd/cc-chat-echo
            goos: windows
            goarch: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: true

      - name: Build
        run: |
          mkdir -p dist
          suffix=""
          [ "${{ matrix.goos }}" = "windows" ] && suffix=".exe"
          out="dist/${{ matrix.component }}-${{ matrix.goos }}-${{ matrix.goarch }}${suffix}"
          ldflags="-s -w"
          if [ "${{ matrix.component }}" = "cc-agent" ]; then
            ldflags="$ldflags -X cc-agent/internal/version.Version=${{ github.ref_name }}"
            ldflags="$ldflags -X cc-agent/internal/version.Commit=${{ github.sha }}"
            ldflags="$ldflags -X cc-agent/internal/version.Date=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          fi
          CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} \
            go -C "${{ matrix.dir }}" build -trimpath -ldflags "$ldflags" \
            -o "../${out}" "${{ matrix.pkg }}"
          echo "OUT_PATH=${out}" >> $GITHUB_ENV

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.component }}-${{ matrix.goos }}-${{ matrix.goarch }}
          path: ${{ env.OUT_PATH }}

  release:
    name: create github release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          overwrite_files: true
          files: |
            dist/*
